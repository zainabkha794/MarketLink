<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="sky3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0C231A"/><stop offset="60%" stop-color="#1B4332"/><stop offset="100%" stop-color="#2D6A4F"/>
    </linearGradient>
    <radialGradient id="mist" cx="50%" cy="64%" r="42%">
      <stop offset="0%" stop-color="#A7D7C5" stop-opacity=".38"/><stop offset="100%" stop-color="#A7D7C5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#215741"/><stop offset="100%" stop-color="#0C231A"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky3)"/>
  <rect width="800" height="500" fill="url(#mist)"/>
  <circle cx="612" cy="96" r="38" fill="#D9BC63" opacity=".9"/>
  <circle cx="612" cy="96" r="60" fill="none" stroke="#D9BC63" stroke-width="1.2" opacity=".3"/>
  <!-- willow trees -->
  <g fill="#0C231A">
    <rect x="112" y="196" width="11" height="150" rx="5"/>
    <ellipse cx="118" cy="180" rx="86" ry="46"/>
    <path d="M60 200 q -8 60 -20 96" stroke="#0C231A" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M92 210 q -6 66 -16 108" stroke="#0C231A" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M148 210 q 8 62 18 104" stroke="#0C231A" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M182 200 q 10 56 22 92" stroke="#0C231A" stroke-width="7" fill="none" stroke-linecap="round"/>
    <rect x="668" y="216" width="10" height="128" rx="5"/>
    <ellipse cx="672" cy="204" rx="70" ry="38"/>
    <path d="M628 222 q -8 52 -18 86" stroke="#0C231A" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M660 230 q -4 56 -12 92" stroke="#0C231A" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M700 228 q 8 52 18 88" stroke="#0C231A" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
  <!-- riverbank -->
  <path d="M0 330 C 150 312, 300 326, 430 332 C 580 340, 700 326, 800 314 L800 500 L0 500 Z" fill="url(#water)"/>
  <!-- water shimmer -->
  <g stroke="#74C69D" stroke-linecap="round" opacity=".5">
    <path d="M120 384 q 60 -8 120 0" stroke-width="3"/>
    <path d="M300 408 q 80 -9 150 0" stroke-width="3"/>
    <path d="M520 386 q 70 -8 130 0" stroke-width="3"/>
    <path d="M220 440 q 90 -10 170 0" stroke-width="3"/>
    <path d="M520 444 q 80 -9 150 0" stroke-width="3"/>
    <path d="M420 366 q 50 -6 96 0" stroke-width="2.4"/>
  </g>
  <!-- riverside stall -->
  <g transform="translate(340 268)">
    <rect x="6" y="30" width="126" height="52" rx="6" fill="#123226"/>
    <path d="M-6 32 L 68 2 L 142 32 Z" fill="#D9BC63"/>
    <path d="M-6 32 L 68 2 L 68 15 L -6 44 Z" fill="#B08D3E"/>
    <rect x="24" y="44" width="24" height="18" rx="3" fill="#A7D7C5"/>
    <rect x="58" y="42" width="24" height="20" rx="3" fill="#74C69D"/>
    <rect x="92" y="44" width="24" height="18" rx="3" fill="#A7D7C5"/>
  </g>
  <!-- small boat -->
  <g transform="translate(596 396)">
    <path d="M-36 0 q 36 18 72 0 l -10 14 q -26 10 -52 0 Z" fill="#0C231A"/>
    <rect x="-2" y="-22" width="3" height="24" fill="#0C231A"/>
    <path d="M1 -22 l 20 12 l -20 8 Z" fill="#D9BC63" opacity=".85"/>
  </g>
  <!-- reeds -->
  <g stroke="#215741" stroke-width="4" stroke-linecap="round">
    <path d="M40 470 q 4 -30 8 -46"/><path d="M52 470 q -2 -26 -8 -40"/>
    <path d="M756 462 q 4 -28 8 -42"/><path d="M768 462 q -2 -24 -8 -38"/>
    <path d="M356 480 q 3 -22 6 -34"/><path d="M448 478 q 3 -22 6 -34"/>
  </g>
</svg>
