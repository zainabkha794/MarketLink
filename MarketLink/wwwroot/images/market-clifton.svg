  </defs>
  <rect width="800" height="500" fill="url(#sky)"/>
  <rect width="800" height="500" fill="url(#sun)"/>
  <circle cx="576" cy="110" r="46" fill="#D9BC63" opacity=".92"/>
  <circle cx="576" cy="110" r="70" fill="none" stroke="#D9BC63" stroke-width="1.4" opacity=".35"/>
